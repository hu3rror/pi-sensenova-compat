# npm 发布工作流(Trusted Publisher / OIDC,零 token,直接流)
# 直接流:push v* tag 即经 OIDC 直接 npm publish,全自动,无人工 2FA 闸门。
# 前置:npmjs.com 已为包配置 Trusted Publisher,绑定本仓库 + 本 workflow 文件名
# (publish.yml),且其 Allowed actions 允许直接发布(npm publish)。
# 首发(v0.1.0)由维护者本地 npm publish,随后绑定 TP,此后再走本流。
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read # 不建占位 Release(agent 手动 gh release create),无需 contents: write
  id-token: write # Trusted Publishing(OIDC)必需;同时自动生成 provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 定制点:Node 24 LTS(npm publish 无 npm 11 门槛)
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install # 仓库无 package-lock.json,不能 npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      # 直接流:OIDC 自动认证并生成 provenance(trusted publishing 下无需
      # --provenance 旗标,显式传入亦无冲突,官方示例即带该旗标)
      - name: Publish to npm registry
        run: npm publish --provenance